info:
  name: Crear documento sin nombre
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseURL}}/api/v1/admin/documents"
  body:
    type: json
    data: "{}"
  auth: inherit

runtime:
  assertions:
    - expression: res.status
      operator: eq
      value: "400"
  actions:
    - type: set-variable
      phase: after-response
      selector:
        expression: res.body.data.id
        method: jsonq
      variable:
        name: documentId
        scope: runtime

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
